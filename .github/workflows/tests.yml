name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Compile package
        run: python -m compileall -q src/hermes_control_pack
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: hcp --version

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip wheel . -w dist
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: hcp --version
      - run: hcp setup --project "$RUNNER_TEMP/hcp-project" --hermes-home "$RUNNER_TEMP/hcp-home" --no-context-engine
      - run: hcp doctor --project "$RUNNER_TEMP/hcp-project" --hermes-home "$RUNNER_TEMP/hcp-home"
      - run: hcp setup --help
